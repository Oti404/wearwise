# Production overlay for a small server (tested target: Google Cloud e2-micro, 1 GB RAM).
# Uses the images published by .github/workflows/publish-images.yml and puts Caddy (automatic HTTPS) in front.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# deploy/setup.sh and deploy/update.sh run exactly these commands.

services:
  db:
    # Sized for ~1 GB RAM shared with the AI engine; plenty for a portfolio-scale workload.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30

  ai-engine:
    image: ${IMAGE_PREFIX:-ghcr.io/oti404/wearwise}-ai-engine:${IMAGE_TAG:-latest}
    environment:
      # Match the VM's 2 shared vCPUs; more threads only add memory and contention.
      OMP_NUM_THREADS: "2"

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/oti404/wearwise}-backend:${IMAGE_TAG:-latest}
    environment:
      DB_POOL_MAX: "5"

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/oti404/wearwise}-frontend:${IMAGE_TAG:-latest}
    # Only Caddy is exposed; nginx stays on the internal network.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keeping them avoids hitting Let's Encrypt rate limits on restarts.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
