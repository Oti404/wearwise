# Weekly dependency update PRs; security fixes are opened as soon as advisories are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Expo pins compatible versions per SDK; upgrade the SDK deliberately instead of package by package.
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /ai_engine
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # torch and torchvision are released as matching pairs (also pinned in the Dockerfile); bump them together.
    groups:
      pytorch:
        patterns: ["torch", "torchvision"]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/ai_engine"]
    schedule: { interval: weekly }
    ignore:
      # Stay on LTS lines (Node 24, Python 3.12); runtime upgrades are planned, not automatic.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
