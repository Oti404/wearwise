# Dependency policy:
# - npm, pip and Docker: SECURITY UPDATES ONLY. open-pull-requests-limit: 0 turns off routine version
#   bumps, while security PRs still arrive (requires "Dependabot security updates" in repo settings).
#   Routine bumps (especially Expo SDK, torch, major versions) are done deliberately and tested together.
# - GitHub Actions: routine weekly updates (low risk, keeps CI off deprecated runtimes).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /ai_engine
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/ai_engine"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
